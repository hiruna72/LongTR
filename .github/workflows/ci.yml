name: CI

on:
  push:
  pull_request:

jobs:
  default-build:
    name: Default build (dynamic) + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git autoconf automake libtool \
            zlib1g-dev libbz2-dev liblzma-dev libdeflate-dev \
            libcurl4-openssl-dev libssl-dev

      - name: Build (unchanged default configuration)
        run: |
          make version
          make HTSLIB-docker SPOA-docker
          make -j"$(nproc)" LongTR DenovoFinder ShardPlanner

      - name: Smoke test (--help + VCF validity)
        run: |
          ./LongTR --help
          sudo apt-get install -y --no-install-recommends bcftools
          bash test_data/ci_fixture/run_smoke_test.sh ./LongTR

      - name: ShardPlanner contract test (locus conservation + verbatim round-trip)
        run: bash test_data/ci_fixture/run_shard_planner_test.sh ./ShardPlanner

      - name: Determinism test (identical input -> identical VCF)
        run: bash test_data/determinism_fixture/run_determinism_test.sh ./LongTR

  portable-build:
    name: Portable static build (Alpine / musl)
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: ver
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - name: Embed version
        run: make version

      - name: Build portable static tarball
        run: |
          docker build \
            --build-arg VERSION="${{ steps.ver.outputs.version }}" \
            --target artifact --output type=local,dest=./dist .

      - name: Verify static + smoke test (--help + VCF validity)
        run: |
          file ./dist/LongTR ./dist/ShardPlanner
          ldd ./dist/LongTR || true          # musl static: prints "not a dynamic executable"
          ldd ./dist/ShardPlanner || true
          ./dist/LongTR --help
          sudo apt-get install -y --no-install-recommends bcftools
          bash test_data/ci_fixture/run_smoke_test.sh ./dist/LongTR
          bash test_data/ci_fixture/run_shard_planner_test.sh ./dist/ShardPlanner

      - name: Determinism test (identical input -> identical VCF)
        run: bash test_data/determinism_fixture/run_determinism_test.sh ./dist/LongTR

      - name: Package portable binaries (stripped + debug)
        id: pkg
        run: |
          HASH=$(git rev-parse --short=7 HEAD)
          git diff --quiet HEAD -- 2>/dev/null || HASH="${HASH}-dirty"
          NAME="LongTR-${HASH}-portable-linux-x86_64"
          mkdir -p out
          cp dist/LongTR       "out/${NAME}"        # stripped (small)
          cp dist/LongTR-debug "out/${NAME}-debug"  # unstripped (gdb/backtrace symbols)
          # ShardPlanner keeps its plain name: longtr_joint_call.pbs resolves it as
          # $(dirname $LONGTR)/ShardPlanner, so it must sit beside LongTR under that exact name.
          cp dist/ShardPlanner       "out/ShardPlanner"
          cp dist/ShardPlanner-debug "out/ShardPlanner-debug"
          chmod +x "out/${NAME}" "out/${NAME}-debug" "out/ShardPlanner" "out/ShardPlanner-debug"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          ls -l out

      # GitHub zips a workflow artifact on download, so this yields
      # LongTR-<hash>-portable-linux-x86_64.zip containing the stripped + -debug binaries.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: out/*
          if-no-files-found: error
